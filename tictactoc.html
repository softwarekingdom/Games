
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b1020">

    <title>SoftwareKingdom | Tic Tac Toe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-container">

        <header class="header">
            <div class="logo">SOFTWAREKINGDOM</div>
            <h1>TIC TAC TOE</h1>
            <p>Challenge Your Mind</p>
        </header>

        <section class="mode-section">
            <h2>Select Game Mode</h2>

            <div class="mode-buttons">
                <button id="computerMode" class="mode-btn active">
                    Player vs Computer
                </button>

                <button id="twoPlayerMode" class="mode-btn">
                    Two Players
                </button>
            </div>
        </section>

        <section class="score-section">

            <div class="score-card">
                <span id="playerOneLabel">PLAYER X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div class="score-card">
                <span>DRAWS</span>
                <strong id="scoreDraw">0</strong>
            </div>

            <div class="score-card">
                <span id="playerTwoLabel">COMPUTER O</span>
                <strong id="scoreO">0</strong>
            </div>

        </section>

        <section class="game-section">

            <div class="turn-indicator" id="turnIndicator">
                PLAYER X'S TURN
            </div>

            <div class="game-board" id="gameBoard">

                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>

                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>

                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>

            </div>

            <div id="gameMessage" class="game-message">
                Make your first move!
            </div>

            <div class="game-controls">

                <button id="restartBtn" class="primary-btn">
                    Restart Game
                </button>

                <button id="resetScoreBtn" class="secondary-btn">
                    Reset Scores
                </button>

                <button id="musicBtn" class="secondary-btn">
                    🎵 Music OFF
                </button>

            </div>

        </section>

        <footer>
            <p>© 2026 SOFTWAREKINGDOM</p>
            <p>Think • Play • Win</p>
        </footer>

    </main>

    <script src="js/music.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
